  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n style=\"font-size:11px;font-weight:800;letter-spacing:.04em;color:#6b7078\">FREE PLAN<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#7c818a;line-height:1.5;margin-bottom:11px\">Unlock accurate geo-targeting, A/B copy and unlimited domains.<\u002Fdiv>\n          <button type=\"button\" onclick=\"{{ goPro }}\" style=\"width:100%;padding:8px;border:none;border-radius:9px;background:linear-gradient(155deg,#5b9bff,#2f6fed);color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 8px rgba(47,111,237,.3)\" style-hover=\"filter:brightness(1.05)\">\n            <span style=\"font-family:'Material Symbols Rounded';font-size:16px;line-height:1\">bolt<\u002Fspan>Upgrade to Pro\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CENTER -->\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#fff\">\n        <div style=\"padding:17px 20px 15px;border-bottom:1px solid #f1f2f5;flex:0 0 auto\">\n          <div style=\"font-size:16px;font-weight:800;letter-spacing:-.02em\">{{ tabTitle }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#7c818a;margin-top:2px;line-height:1.45\">{{ tabDesc }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow-y:auto;padding:18px 20px 26px\">\n\n          <!-- CATEGORIES -->\n          <sc-if value=\"{{ tabCategories }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ categoriesView }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"{{ c.cardStyle }}\">\n                  <div style=\"display:flex;align-items:flex-start;gap:12px\">\n                    <div style=\"{{ c.iconWrapStyle }}\"><span style=\"{{ c.iconStyle }}\">{{ c.icon }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n aterial Symbols Rounded';font-size:23px;color:#9aa0a8;line-height:1\">gpp_maybe<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13.5px;font-weight:700;color:#42464e\">Consent Mode is off<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8a8f98;margin-top:4px;line-height:1.5;max-width:310px;margin-left:auto;margin-right:auto\">No signals are broadcast while it's off. Turn it on to sync consent with your Google tags.<\u002Fdiv>\n                  <button type=\"button\" onclick=\"{{ consentModeToggle.onClick }}\" style=\"margin-top:15px;padding:9px 16px;border:none;border-radius:10px;background:#22252b;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#000\">Enable Consent Mode<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ consentOn }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin-bottom:4px\">DEFAULT SIGNAL STATES<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8a8f98;line-height:1.5;margin-bottom:8px\">Every signal starts denied, then flips to granted per the visitor's choice.<\u002Fdiv>\n                <sc-for list=\"{{ consentSignalRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f2f3f6\">\n                    <span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#3a3f47;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.sig }}<\u002Fspan>\n                    <span style=\"{{ r.chipStyle }}\">{{ r.catLabel }}<\u002Fspan>\n                    <span style=\"{{ r.defStyle }}\">{{ r.def }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:6px 16px 8px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin:12px 0 2px\">ADVANCED<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #f2f3f6\">\n                  <div style=\"flex:1\"><div style=\"font-size:13px;font-weight:600;color:#22252b\">Wait for update<\u002Fdiv><div style=\"font-size:11.5px;color:#8a8f98;margin-top:2px;line-height:1.4\">Delay before tags read the default state.<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:2px;border:1px solid #e6e8ee;border-radius:10px;padding:3px;background:#fbfbfc\">\n                    <button type=\"button\" onclick=\"{{ decWait }}\" style=\"width:28px;height:28px;border:none;background:#fff;border-radius:8px;cursor:pointer;color:#5a6069;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,28,45,.06)\"><span style=\"font-family:'Material Symbols Rounded';font-size:18px;line-height:1\">remove<\u002Fspan><\u002Fbutton>\n                    <div style=\"min-width:62px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:#22252b\">{{ cfg.waitForUpdate }} ms<\u002Fdiv>\n                    <button type=\"button\" onclick=\"{{ incWait }}\" style=\"width:28px;height:28px;border:none;background:#fff;border-radius:8px;cursor:pointer;color:#5a6069;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(23,28,45,.06)\"><span style=\"font-family:'Material Symbols Rounded';font-size:18px;line-height:1\">add<\u002Fspan><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-start;gap:12px;padding:13px 0\">\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:600;color:#22252b\">URL passthrough<\u002Fdiv><div style=\"font-size:11.5px;color:#8a8f98;margin-top:2px;line-height:1.45\">Preserve ad click IDs across pages when cookies are denied.<\u002Fdiv><\u002Fdiv>\n                  <div onclick=\"{{ urlPassToggle.onClick }}\" style=\"{{ urlPassToggle.trackStyle }}\"><div style=\"{{ urlPassToggle.knobStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- SCRIPTS -->\n          <sc-if value=\"{{ tabScripts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;gap:10px;background:#f5f8ff;border:1px solid #dbe8ff;border-radius:12px;padding:12px 13px\">\n                <span style=\"font-family:'Material Symbols Rounded';font-size:18px;color:#2f6fed;line-height:1.2\">info<\u002Fspan>\n                <div style=\"font-size:11.5px;color:#3d5680;line-height:1.5\">Listed tags stay blocked until the visitor consents to their category. Scripts tagged <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;background:#e5efff;padding:1px 5px;border-radius:4px\">type=\"text/plain\"<\u002Fspan> are detected automatically.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ scriptsView }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"background:#fff;border:1px solid #edeef3;border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:12px\">\n                  <div style=\"width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:#f2f3f6;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Material Symbols Rounded';font-size:19px;color:#6b7078;line-height:1\">code<\u002Fspan><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:700;color:#22252b\">{{ s.name }}<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9298a1;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.src }} · {{ s.id }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"{{ s.chipStyle }}\">{{ s.catLabel }}<\u002Fspan>\n                  <button type=\"button\" onclick=\"{{ s.onDelete }}\" style=\"width:28px;height:28px;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#c2c6ce;display:flex;align-items:center;justify-content:center;flex:0 0 auto\" style-hover=\"background:#fbeaea;color:#e0655c\"><span style=\"font-family:'Material Symbols Rounded';font-size:18px;line-height:1\">delete<\u002Fspan><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ scriptsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1.5px dashed #dcdfe6;border-radius:14px;padding:28px 18px;text-align:center;background:#fcfcfd\">\n                  <div style=\"width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:#eef0f4;display:flex;align-items:center;justify-content:center\"><span style=\"font-family:'Material Symbols Rounded';font-size:23px;color:#9aa0a8;line-height:1\">code_off<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:13.5px;font-weight:700;color:#42464e\">No managed scripts<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8a8f98;margin-top:4px;line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto\">Tags you add in Framer are auto-detected and blocked. Add one here to control it manually.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button type=\"button\" onclick=\"{{ openScript }}\" style=\"margin-top:2px;padding:12px;border:1.5px dashed #d8dbe2;border-radius:12px;background:#fcfcfd;color:#5a6069;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px\" style-hover=\"border-color:#2f6fed;color:#2f6fed;background:#f5f8ff\">\n                <span style=\"font-family:'Material Symbols Rounded';font-size:18px;line-height:1\">add<\u002Fspan>Add managed script\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STYLE -->\n          <sc-if value=\"{{ tabStyle }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px\">\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin-bottom:11px\">THEME<\u002Fdiv>\n                <div style=\"display:flex;gap:3px;background:#f0f1f5;padding:3px;border-radius:10px\">\n                  <sc-for list=\"{{ themeSeg }}\" as=\"s\" hint-placeholder-count=\"3\"><div onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin-bottom:12px\">ACCENT COLOR<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:15px\">\n                  <label style=\"position:relative;width:40px;height:40px;border-radius:11px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px rgba(23,28,45,.1);flex:0 0 auto;display:block\">\n                    <input type=\"color\" value=\"{{ cfg.accent }}\" oninput=\"{{ onAccent }}\" style=\"position:absolute;top:-8px;left:-8px;width:58px;height:58px;border:none;padding:0;background:none;cursor:pointer\">\n                  <\u002Flabel>\n                  <input type=\"text\" value=\"{{ cfg.accent }}\" oninput=\"{{ onAccent }}\" style=\"flex:1;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-size:13px;color:#22252b;background:#f6f7f9;border:1px solid #eceef2;padding:11px 12px;border-radius:10px;text-transform:uppercase;outline:none\" style-focus=\"{{ focusRing }}\">\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;color:#a2a7b0;margin-bottom:9px\">PRESETS<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ swatches }}\" as=\"sw\" hint-placeholder-count=\"6\"><div onclick=\"{{ sw.onClick }}\" style=\"{{ sw.style }}\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin-bottom:11px\">LAYOUT<\u002Fdiv>\n                <div style=\"display:flex;gap:3px;background:#f0f1f5;padding:3px;border-radius:10px;margin-bottom:14px\">\n                  <sc-for list=\"{{ layoutSeg }}\" as=\"s\" hint-placeholder-count=\"3\"><div onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8;margin-bottom:10px\">POSITION<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                  <sc-for list=\"{{ posOpts }}\" as=\"p\" hint-placeholder-count=\"4\">\n                    <div onclick=\"{{ p.onClick }}\">\n                      <div style=\"{{ p.frameStyle }}\"><div style=\"{{ p.dotStyle }}\"><\u002Fdiv><\u002Fdiv>\n                      <div style=\"{{ p.labelStyle }}\">{{ p.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:15px 16px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.06em;color:#9aa0a8\">CORNER RADIUS<\u002Fdiv><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5a6069\">{{ cfg.radius }}px<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"28\" value=\"{{ cfg.radius }}\" oninput=\"{{ onRadius }}\" style=\"{{ sliderStyle }}\">\n                <div style=\"display:flex;align-items:flex-start;gap:12px;padding:15px 0 3px;margin-top:8px;border-top:1px solid #f2f3f6\">\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:600;color:#22252b\">Dim the page behind<\u002Fdiv><div style=\"font-size:11.5px;color:#8a8f98;margin-top:2px;line-height:1.45\">Adds a backdrop overlay to focus attention.<\u002Fdiv><\u002Fdiv>\n                  <div onclick=\"{{ overlayToggle.onClick }}\" style=\"{{ overlayToggle.trackStyle }}\"><div style=\"{{ overlayToggle.knobStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- TEXT -->\n          <sc-if value=\"{{ tabText }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px\">\n              <div>\n                <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:6px;display:block\">Language<\u002Flabel>\n                <button type=\"button\" style=\"width:100%;display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #e4e6ec;border-radius:10px;background:#fff;cursor:pointer;text-align:left\" style-hover=\"border-color:#cfd3db\">\n                  <span style=\"font-family:'Material Symbols Rounded';font-size:18px;color:#7c818a;line-height:1\">public<\u002Fspan>\n                  <span style=\"flex:1;font-size:13px;font-weight:600;color:#22252b\">English (US)<\u002Fspan>\n                  <span style=\"font-family:'Material Symbols Rounded';font-size:20px;color:#a2a7b0;line-height:1\">expand_more<\u002Fspan>\n                <\u002Fbutton>\n                <div style=\"font-size:11px;color:#a2a7b0;margin-top:6px\">Add more languages with Pro — the banner auto-detects the visitor's locale.<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ textFields }}\" as=\"f\" hint-placeholder-count=\"7\">\n                <div>\n                  <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:6px;display:block\">{{ f.label }}<\u002Flabel>\n                  <sc-if value=\"{{ f.multiline }}\" hint-placeholder-val=\"{{ false }}\">\n                    <textarea rows=\"3\" oninput=\"{{ f.onChange }}\" value=\"{{ f.value }}\" style=\"{{ f.inputStyle }}\" style-focus=\"{{ focusRing }}\"><\u002Ftextarea>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ f.single }}\" hint-placeholder-val=\"{{ true }}\">\n                    <input type=\"text\" value=\"{{ f.value }}\" oninput=\"{{ f.onChange }}\" style=\"{{ f.inputStyle }}\" style-focus=\"{{ focusRing }}\">\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- LICENSE -->\n          <sc-if value=\"{{ tabLicense }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:15px\">\n              <div style=\"background:#fff;border:1px solid #edeef3;border-radius:13px;padding:16px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:13px\">\n                  <div style=\"font-size:13.5px;font-weight:700;color:#22252b\">License key<\u002Fdiv>\n                  <span style=\"{{ statusPillStyle }}\">{{ statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <input type=\"text\" placeholder=\"CONSENTFUL-XXXX-XXXX-XXXX\" value=\"{{ cfg.licenseKey }}\" oninput=\"{{ onLicense }}\" style=\"flex:1;padding:9px 12px;border:1px solid #e4e6ec;border-radius:10px;background:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;color:#22252b;outline:none\" style-focus=\"{{ focusRing }}\">\n                  <button type=\"button\" onclick=\"{{ activate }}\" style=\"padding:0 16px;border:none;border-radius:10px;background:#22252b;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap\" style-hover=\"background:#000\">Activate<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#a2a7b0;margin-top:8px\">Validated on-device against Lemon Squeezy. Works offline once activated.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n                <div style=\"{{ freeCardStyle }}\">\n                  <div style=\"font-size:12.5px;font-weight:800;color:#22252b\">Free<\u002Fdiv>\n                  <div style=\"font-size:20px;font-weight:800;color:#22252b;margin:6px 0 10px\">$0<\u002Fdiv>\n                  <sc-for list=\"{{ freeFeatures }}\" as=\"f\" hint-placeholder-count=\"3\"><div style=\"display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;color:#5a6069\"><span style=\"font-family:'Material Symbols Rounded';font-size:16px;color:#16a34a;line-height:1\">check<\u002Fspan>{{ f }}<\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"{{ proCardStyle }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-size:12.5px;font-weight:800;color:#22252b\">Pro<\u002Fspan><span style=\"font-size:9px;font-weight:800;letter-spacing:.04em;color:#c9932a;background:#fdf4e1;padd enter;justify-content:center\" style-hover=\"background:#f2f3f6;color:#42464e\"><span style=\"font-family:'Material Symbols Rounded';font-size:19px;line-height:1\">close<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:15px\">\n            <div>\n              <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:6px;display:block\">Name<\u002Flabel>\n              <input type=\"text\" placeholder=\"e.g. LinkedIn Insight Tag\" value=\"{{ draftScript.name }}\" oninput=\"{{ setScrName }}\" style=\"{{ catInputStyle }}\" style-focus=\"{{ focusRing }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:6px;display:block\">Source domain<\u002Flabel>\n              <input type=\"text\" placeholder=\"snap.licdn.com\" value=\"{{ draftScript.src }}\" oninput=\"{{ setScrSrc }}\" style=\"{{ scrMonoStyle }}\" style-focus=\"{{ focusRing }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:6px;display:block\">Tag ID <span style=\"color:#a2a7b0;font-weight:600\">(optional)<\u002Fspan><\u002Flabel>\n              <input type=\"text\" placeholder=\"1234567\" value=\"{{ draftScript.id }}\" oninput=\"{{ setScrId }}\" style=\"{{ scrMonoStyle }}\" style-focus=\"{{ focusRing }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:12px;font-weight:700;color:#42464e;margin-bottom:8px;display:block\">Blocked until consent to<\u002Flabel>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ scrCatChoices }}\" as=\"o\" hint-placeholder-count=\"3\"><div onclick=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.name }}<\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid #f0f1f4;background:#fbfbfc;flex:0 0 auto\">\n            <button type=\"button\" onclick=\"{{ closeModal }}\" style=\"padding:9px 15px;border:1px solid #e2e4ea;border-radius:10px;background:#fff;color:#42464e;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#f6f7f9\">Cancel<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ createScript }}\" style=\"{{ scrBtnStyle }}\">Add script<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== PUBLISH SUCCESS ===== -->\n    <sc-if value=\"{{ published }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;z-index:80;background:rgba(18,22,31,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div style=\"width:404px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px -18px rgba(23,28,45,.55)\">\n          <div style=\"padding:34px 32px 8px;text-align:center\">\n            <div style=\"width:66px;height:66px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(155deg,#34d17f,#16a34a);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(22,163,74,.4)\"><span style=\"font-family:'Material Symbols Rounded';font-size:34px;color:#fff;line-height:1\">check<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:21px;font-weight:800;letter-spacing:-.02em;color:#191b1f\">You're live!<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#7c818a;line-height:1.55;margin:8px auto 0;max-width:300px\">Consentful is now active on <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#42464e\">yoursite.com<\u002Fspan>. Visitors will see your banner on their next visit.<\u002Fdiv>\n            <div style=\"margin-top:20px;border:1px solid #edeef3;border-radius:13px;overflow:hidden;text-align:left\">\n              <sc-for list=\"{{ publishSummary }}\" as=\"i\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid #f2f3f6\"><span style=\"font-size:12px;color:#7c818a;font-weight:600\">{{ i.label }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:700;color:#22252b\">{{ i.value }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;padding:18px 32px 24px\">\n            <button type=\"button\" style=\"flex:1;padding:11px;border:1px solid #e2e4ea;border-radius:11px;background:#fff;color:#42464e;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px\" style-hover=\"background:#f6f7f9\"><span style=\"font-family:'Material Symbols Rounded';font-size:17px;line-height:1\">open_in_new<\u002Fspan>View live site<\u002Fbutton>\n            <button type=\"button\" onclick=\"{{ closePublish }}\" style=\"flex:1;padding:11px;border:none;border-radius:11px;background:#22252b;color:#fff;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#000\">Done<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'categories',\n    saved: true,\n    preview: 'banner',\n    onboarding: true,\n    onbStep: 0,\n    modal: null,\n    publishState: 'idle',\n    draftCat: { name: '', desc: '', signals: [], required: false },\n    draftScript: { name: '', src: '', id: '', cat: 'analytics' },\n    cfg: {\n      accent: '#2F6FED',\n      radius: 16,\n      layout: 'card',\n      position: 'bottom-right',\n      overlay: false,\n      theme: 'light',\n      heading: 'We value your privacy',\n      body: 'We use cookies to improve your experience, analyze traffic and personalize content. Choose which categories to allow.',\n      acceptLabel: 'Accept all',\n      rejectLabel: 'Reject all',\n      manageLabel: 'Manage preferences',\n      saveLabel: 'Save choices',\n      privacyUrl: 'https://yoursite.com/privacy',\n      showWhen: 'eea',\n      expiryDays: 180,\n      waitForUpdate: 500,\n      respectDNT: true,\n      hideAfter: true,\n      reloadOnChange: false,\n      consentMode: true,\n      urlPassthrough: false,\n      licenseKey: '',\n      plan: 'free',\n      categories: [\n        { id: 'necessary', name: 'Strictly necessary', desc: 'Required for the site to function. Cannot be switched off.', signals: ['security_storage'], enabled: true, locked: true },\n        { id: 'analytics', name: 'Analytics', desc: 'Helps us understand how visitors use the site.', signals: ['analytics_storage'], enabled: true, locked: false },\n        { id: 'marketing', name: 'Marketing', desc: 'Used to deliver relevant ads and measure campaigns.', signals: ['ad_storage', 'ad_user_data', 'ad_personalization'], enabled: false, locked: false },\n        { id: 'preferences', name: 'Preferences', desc: 'Remembers choices like language and region.', signals: ['functionality_storage'], enabled: false, locked: false }\n      ],\n      scripts: [\n        { name: 'Google Analytics 4', id: 'G-4XZ8QP', src: 'googletagmanager.com', cat: 'analytics' },\n        { name: 'Meta Pixel', id: '1094-8823', src: 'connect.facebook.net', cat: 'marketing' },\n        { name: 'Hotjar', id: 'hjid 3312', src: 'static.hotjar.com', cat: 'analytics' }\n      ]\n    }\n  };\n\n  touch() {\n    this.setState({ saved: false });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ saved: true }), 850);\n  }\n  set(k, v) { this.setState(s => ({ cfg: { ...s.cfg, [k]: v } })); this.touch(); }\n  toggle(k) { this.set(k, !this.state.cfg[k]); }\n  toggleCat(id) {\n    const cats = this.state.cfg.categories.map(c => (c.id === id && !c.locked) ? { ...c, enabled: !c.enabled } : c);\n    this.set('categories', cats);\n  }\n  deleteCat(id) { this.set('categories', this.state.cfg.categories.filter(c => !(c.id === id && !c.locked))); }\n  deleteScript(i) { this.set('scripts', this.state.cfg.scripts.filter((_, idx) => idx !== i)); }\n  addPreset(id) {\n    const P = {\n      analytics: { id: 'analytics', name: 'Analytics', desc: 'Helps us understand how visitors use the site.', signals: ['analytics_storage'], enabled: true, locked: false },\n      marketing: { id: 'marketing', name: 'Marketing', desc: 'Used to deliver relevant ads and measure campaigns.', signals: ['ad_storage', 'ad_user_data', 'ad_personalization'], enabled: false, locked: false },\n      preferences: { id: 'preferences', name: 'Preferences', desc: 'Remembers choices like language and region.', signals: ['functionality_storage'], enabled: false, locked: false }\n    };\n    if (!P[id] || this.state.cfg.categories.some(c => c.id === id)) return;\n    this.set('categories', [...this.state.cfg.categories, P[id]]);\n  }\n  onbNext() { if (this.state.onbStep >= 4) this.setState({ onboarding: false }); else this.setState(s => ({ onbStep: s.onbStep + 1 })); }\n  onbBack() { this.setState(s => ({ onbStep: Math.max(0, s.onbStep - 1) })); }\n  onbSkip() { this.setState({ onboarding: false }); }\n  openModal(kind) {\n    const firstOpt = (this.state.cfg.categories.find(c => !c.locked) || { id: 'analytics' }).id;\n    this.setState({ modal: kind, draftCat: { name: '', desc: '', signals: [], required: false }, draftScript: { name: '', src: '', id: '', cat: firstOpt } });\n  }\n  closeModal() { this.setState({ modal: null }); }\n  doPublish() { if (this.state.publishState === 'publishing') return; this.setState({ publishState: 'publishing' }); clearTimeout(this._pt); this._pt = setTimeout(() => this.setState({ publishState: 'done' }), 1100); }\n  closePublish() { this.setState({ publishState: 'idle' }); }\n  patchCat(p) { this.setState(s => ({ draftCat: { ...s.draftCat, ...p } })); }\n  patchScript(p) { this.setState(s => ({ draftScript: { ...s.draftScript, ...p } })); }\n  toggleDraftSignal(sig) {\n    this.setState(s => { const has = s.draftCat.signals.includes(sig); return { draftCat: { ...s.draftCat, signals: has ? s.draftCat.signals.filter(x => x !== sig) : [...s.draftCat.signals, sig] } }; });\n  }\n  createCategory() {\n    const d = this.state.draftCat; if (!d.name.trim()) return;\n    let base = d.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'category';\n    let id = base, n = 2; while (this.state.cfg.categories.some(c => c.id === id)) { id = base + '-' + n; n++; }\n    const cat = { id, name: d.name.trim(), desc: d.desc.trim() || 'Custom consent category.', signals: d.signals.length ? d.signals : ['functionality_storage'], enabled: true, locked: false };\n    this.set('categories', [...this.state.cfg.categories, cat]); this.setState({ modal: null });\n  }\n  createScript() {\n    const d = this.state.draftScript; if (!d.name.trim()) return;\n    const sc = { name: d.name.trim(), src: d.src.trim() || 'example.com', id: d.id.trim() || '\\u2014', cat: d.cat };\n    this.set('scripts', [...this.state.cfg.scripts, sc]); this.setState({ modal: null });\n  }\n\n  renderVals() {\n    const cfg = this.state.cfg;\n    const A = cfg.accent;\n    const catColor = { necessary: '#6B7280', analytics: '#2F6FED', marketing: '#8B5CF6', preferences: '#E8973A' };\n    const catName = { necessary: 'Necessary', analytics: 'Analytics', marketing: 'Marketing', preferences: 'Preferences' };\n    const catIcon = { necessary: 'shield', analytics: 'monitoring', marketing: 'ads_click', preferences: 'settings' };\n\n    const mi = (name, size, color) => ({ fontFamily: \"'Material Symbols Rounded'\", fontSize: size + 'px', lineHeight: 1, color: color, display: 'inline-block' });\n\n    // ---- tabs ----\n    const defs = [\n      ['categories', 'Categories', 'category'], ['behavior', 'Behavior', 'tune'],\n      ['consent', 'Consent Mode', 'verified_user'], ['scripts', 'Scripts', 'code'],\n      ['style', 'Style', 'palette'], ['text', 'Text', 'text_fields'],\n      ['license', 'License', 'workspace_premium'], ['preview', 'Publish', 'rocket_launch']\n    ];\n    const tabs = defs.map(([id, label, icon]) => {\n      const active = this.state.tab === id;\n      return {\n        id, label, icon,\n        onClick: () => this.setState({ tab: id }),\n        itemStyle: { display: 'flex', alignItems: 'center', gap: '11px', padding: '8px 10px', border: 'none', borderRadius: '9px', background: active ? '#edf3ff' : 'transparent', cursor: 'pointer', width: '100%', textAlign: 'left', transition: 'background .13s' },\n        iconStyle: mi(icon, 20, active ? A : '#8a9099'),\n        labelStyle: { fontSize: '13px', fontWeight: active ? 700 : 600, color: active ? '#1d5bd6' : '#4a4f57', letterSpacing: '-.01em' }\n      };\n    });\n\n    const titles = {\n      categories: ['Categories', 'Define the consent groups shown to visitors and the signals each controls.'],\n      behavior: ['Behavior', 'Control when the banner appears and how long a choice is remembered.'],\n      consent: ['Consent Mode', 'Configure the Google Consent Mode v2 signals broadcast to your tags.'],\n      scripts: ['Scripts', 'Manage third-party tags that stay blocked until consent is given.'],\n      style: ['Style', 'Match the banner to your brand — theme, color, layout and shape.'],\n      text: ['Text', 'Write the copy shown in the banner and preferences dialog.'],\n      license: ['License', 'Activate your key to unlock Pro features across all your sites.'],\n      preview: ['Publish', 'Review what will be added to your site, then go live.']\n    };\n    const [tabTitle, tabDesc] = titles[this.state.tab];\n\n    // ---- toggle helper ----\n    const tog = (key, label, desc) => {\n      const on = !!cfg[key];\n      return {\n        label, desc, on, onClick: () => this.toggle(key),\n        trackStyle: { width: '42px', height: '24px', borderRadius: '20px', background: on ? A : '#d6dae1', position: 'relative', transition: 'background .18s', flex: '0 0 auto', cursor: 'pointer' },\n        knobStyle: { position: 'absolute', top: '2px', left: '2px', width: '20px', height: '20px', borderRadius: '50%', background: '#fff', boxShadow: '0 1px 3px rgba(23,28,45,.28)', transform: on ? 'translateX(18px)' : 'translateX(0)', transition: 'transform .18s' }\n      };\n    };\n\n    // ---- segmented helper ----\n    const seg = (key, opts, touch) => opts.map(([val, label]) => {\n      const active = cfg[key] === val;\n      return {\n        label, active,\n        onClick: () => touch === false ? this.setState({ [key]: val }) : this.set(key, val),\n        style: { flex: 1, textAlign: 'center', padding: '7px 8px', fontSize: '12px', fontWeight: 600, borderRadius: '7px', cursor: 'pointer', color: active ? '#22252b' : '#7c818a', background: active ? '#fff' : 'transparent', boxShadow: active ? '0 1px 2px rgba(23,28,45,.1), 0 0 0 1px rgba(23,28,45,.04)' : 'none', transition: 'all .15s' }\n      };\n    });\n\n    // ---- categories view ----\n    const categoriesView = cfg.categories.map(c => {\n      const col = catColor[c.id] || '#6B7280';\n      const ic = catIcon[c.id] || 'category';\n      const on = c.enabled;\n      return {\n        id: c.id, name: c.name, desc: c.desc, signals: c.signals, locked: c.locked, unlocked: !c.locked,\n        icon: ic, onToggle: () => this.toggleCat(c.id), onDelete: () => this.deleteCat(c.id),\n        cardStyle: { background: '#fff', border: '1px solid #edeef3', borderRadius: '13px', padding: '14px' },\n        iconWrapStyle: { width: '34px', height: '34px', flex: '0 0 auto', borderRadius: '10px', background: col + '18', display: 'flex', alignItems: 'center', justifyContent: 'center' },\n        iconStyle: mi(ic, 19, col),\n        chipStyle: { fontFamily: \"'JetBrains Mono',
