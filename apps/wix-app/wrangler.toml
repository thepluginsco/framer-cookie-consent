# Cloudflare Worker config for the Wix Data Client (Phase 3.5 App shell).
#
# This is the credential-holding half AND the per-site config store (Wix is not
# ∅-infra): it owns the OAuth client_secret + app-instance tokens (in the TOKENS
# KV), stores each site's config (in the CONFIGS KV) and serves it to the
# published-site bootstrap, and runs the shared installWixLoader/removeWixLoader
# engine against the live Wix REST APIs.
#
# Before deploying, set the secret (never commit it):
#   wrangler secret put WIX_APP_SECRET
# and create the KV namespaces, pasting their ids below:
#   wrangler kv namespace create TOKENS
#   wrangler kv namespace create CONFIGS

name = "consentful-wix"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Public/build-time vars (secrets go via `wrangler secret put`).
[vars]
WIX_APP_ID = ""            # set to your Wix app id (OAuth client_id)
WIX_REDIRECT_URL = ""      # https://<worker-host>/callback (registered on the app)
APP_ORIGIN = ""            # the dashboard app origin, for the post-install bounce + CORS

# KV binding for stored per-site tokens (token:<siteId> -> {access_token, refresh_token}).
# Replace `id` with the id printed by `wrangler kv namespace create TOKENS`.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_TOKENS_KV_ID"

# KV binding for the per-site config store (config:<siteId> -> serialized config JSON).
# The published-site bootstrap fetches from GET /api/wix/config/<siteId>.
# Replace `id` with the id printed by `wrangler kv namespace create CONFIGS`.
[[kv_namespaces]]
binding = "CONFIGS"
id = "REPLACE_WITH_CONFIGS_KV_ID"
