# Cloudflare Worker for Consentful on Wix (Phase 3.5 App shell).
#
# One origin serves everything: the dashboard page Wix iframes, the consent
# bridge asset, the per-site config store the published-site bootstrap fetches
# (Wix is not ∅-infra), and the app API. Wix calls use OAuth client credentials
# minted per request from the site's signed app instance — no tokens stored.
#
# Before deploying, set the secret (never commit it):
#   wrangler secret put WIX_APP_SECRET
# Build first so the dashboard + bridge are in dist/:
#   npm run build && npm run deploy:worker

name = "consentful-wix"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# The built dashboard (index.html + assets) and consentful-wix-bridge.js.
# Requests that match no file fall through to the Worker (the /api routes).
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/runtime.js"]

# Public vars (the secret goes via `wrangler secret put`).
[vars]
WIX_APP_ID = "8e3924a2-1065-41e3-b69b-b5869300378c"   # Wix app id (OAuth client_id)

# Per-site config store (config:<siteKey> -> serialized config JSON), served to
# the published-site bootstrap at GET /api/wix/config/<siteKey>.
[[kv_namespaces]]
binding = "CONFIGS"
id = "6a70edb169bd4bc18a631c33b90df7fe"   # consentful-wix-configs
