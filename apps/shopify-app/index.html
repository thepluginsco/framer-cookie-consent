<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consentful for Shopify</title>
    <meta
      name="description"
      content="Design your cookie-consent banner inside Shopify admin and publish it to your storefront, with a bridge into Shopify's Customer Privacy API."
    />
    <!-- App Bridge: embeds the app in Shopify admin and enables direct Admin API
         access. Must be the first script, loaded synchronously. The API key is the
         app's client id (injected by `shopify app dev`, or set in .env for builds). -->
    <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
